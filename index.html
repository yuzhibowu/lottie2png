<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lottie 动画格式转换工具</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1a1a1a;
      --muted: #666666;
      --line: #d0d0d0;
      --paper: #f2f2f2;
      --panel: #ffffff;
      --accent: #222222;
      --accent-dark: #000000;
      --warm: #888888;
      --danger: #222222;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f2f0ec;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      width: min(1416px, calc(100vw - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    header {
      display: grid;
      grid-template-columns: minmax(372px, 504px) minmax(0, 1fr);
      align-items: flex-start;
      gap: 22px;
      margin-bottom: 22px;
    }

    .header-right {
      justify-self: end;
      display: grid;
      justify-items: end;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 10px;
    }

    .social-link {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      color: #000000;
      text-decoration: none;
    }

    .social-link svg,
    .social-link img {
      width: 20px;
      height: 20px;
      display: block;
    }

    .panel-footer {
      margin-top: auto;
      padding-top: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .headline {
      min-width: 0;
    }

    h1,
    .brand-name {
      margin: 0 0 8px;
      font-size: clamp(20px, 3.5vw, 38px);
      line-height: 1;
      letter-spacing: 0;
    }

    .brand-name {
      justify-self: end;
      margin: 0;
      color: #111111;
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    .brand-name::after {
      content: "";
      display: block;
      width: 100%;
      height: 6px;
      margin-top: 5px;
      background: #f5e568;
    }

    .subhead {
      width: 100%;
      margin: 0;
      color: var(--muted);
      font-size: 11.2px;
      line-height: 1.5;
    }

    main {
      display: grid;
      grid-template-columns: minmax(372px, 504px) minmax(0, 1fr);
      gap: 22px;
      align-items: stretch;
    }

    .panel,
    .preview-shell {
      border: 0;
      border-radius: 0;
      background: rgba(255,255,255,0.92);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 22px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .dropzone {
      display: grid;
      place-items: center;
      min-height: 188px;
      padding: 22px;
      border: 2px dashed #999999;
      border-radius: 0;
      background: #fafafa;
      text-align: center;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--accent);
      background: #f0f0f0;
      transform: translateY(-1px);
    }

    .dropzone input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .upload-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #f5e568;
      color: var(--accent-dark);
    }

    .upload-title {
      margin: 0;
      font-weight: 800;
      font-size: 18px;
    }

    .file-name {
      min-height: 22px;
      margin: 12px 0 0;
      color: var(--accent-dark);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .controls {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      color: #333333;
      font-size: 13px;
      font-weight: 800;
    }

    .field-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) calc((100% - 24px) / 4);
      gap: 10px;
      align-items: center;
    }

    .fps-field {
      margin-top: 3px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="number"],
    select {
      width: 100%;
      border: 1px solid #cccccc;
      border-radius: 0;
      padding: 0 10px;
      background: white;
      color: var(--ink);
      font-size: 13px;
    }

    input[type="number"] {
      height: 36px;
      text-align: left;
    }

    select {
      height: 42px;
    }

    .quick-sizes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .format-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .format-option {
      min-width: 0;
      cursor: pointer;
    }

    .format-option input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    .format-option span {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px 9px;
      border: 1px solid #cccccc;
      border-radius: 0;
      background: white;
      color: #333333;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .format-option input:checked + span {
      border-color: #000000;
      background: #000000;
      color: #ffffff;
    }

    .format-option input:focus-visible + span {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .chip {
      height: 36px;
      border: 1px solid #cccccc;
      border-radius: 0;
      background: white;
      color: #333333;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .chip.active {
      border-color: #000000;
      background: #000000;
      color: #ffffff;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .button {
      min-height: 40px;
      border: 0;
      border-radius: 0;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    .button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.52;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .primary:hover:not(:disabled) {
      background: var(--accent-dark);
    }

    .secondary {
      background: #eeeeee;
      color: #222222;
    }

    .status {
      min-height: 24px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .status.error {
      color: var(--danger);
      font-weight: 800;
    }

    .progress {
      height: 8px;
      margin-top: 10px;
      border-radius: 0;
      background: #dddddd;
      overflow: hidden;
    }

    .progress span {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #111111, #888888);
      transition: width 100ms linear;
    }

    .language-control {
      position: relative;
      align-self: flex-start;
    }

    .language-trigger {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #111111;
      font-size: 13px;
      font-weight: 800;
    }

    .language-menu-button {
      width: 5px;
      height: 5px;
      min-width: 5px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #000000;
      cursor: pointer;
    }

    .language-menu-button[aria-expanded="true"] {
      width: 9px;
      height: 9px;
      min-width: 9px;
      border-radius: 0;
    }

    .language-menu-button[aria-expanded="true"]::after {
      content: "";
      display: block;
      width: 3px;
      height: 3px;
      margin: 1px auto 0;
      border-right: 1px solid #ffffff;
      border-bottom: 1px solid #ffffff;
      transform: rotate(45deg);
    }

    .language-menu {
      position: absolute;
      left: 0;
      bottom: 15px;
      z-index: 10;
      width: 110px;
      padding: 5px 0;
      border: 1px solid #bdbdbd;
      background: #000000;
      box-shadow: var(--shadow);
    }

    .language-menu[hidden] {
      display: none;
    }

    .language-menu button {
      width: 100%;
      min-height: 24px;
      padding: 0 15px;
      border: 0;
      background: #000000;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }

    .language-menu button:hover,
    .language-menu button[aria-current="true"] {
      background: #222222;
    }

    .preview-shell {
      min-height: 744px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }

    .preview-top {
      height: 20px;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 0 10px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    .preview-title {
      min-width: 0;
      max-width: 65%;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
    }

    .stage {
      position: relative;
      min-height: 564px;
      display: grid;
      place-items: center;
      padding: 29px;
      background-color: #fafafa;
      background-image:
        linear-gradient(45deg, #dddddd 25%, transparent 25%),
        linear-gradient(-45deg, #dddddd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #dddddd 75%),
        linear-gradient(-45deg, transparent 75%, #dddddd 75%);
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
      overscroll-behavior: contain;
    }

    #lottiePreview {
      --preview-scale: 1;
      width: min(100%, 744px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border-radius: 0;
      background: rgba(255,255,255,0.68);
      overflow: hidden;
    }

    #lottiePreview > svg,
    #lottiePreview > canvas {
      transform: scale(var(--preview-scale)) !important;
      transform-origin: 50% 50%;
    }

    .empty {
      max-width: 340px;
      text-align: center;
      color: #666666;
      line-height: 1.6;
      font-weight: 700;
    }

    .preview-bottom {
      height: 20px;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 10px;
      text-align: right;
      border-top: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .preview-bottom span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-bottom span:last-child {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .hidden-workbench {
      position: fixed;
      left: -10000px;
      top: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .hidden-workbench canvas {
      display: block;
    }

    @media (max-width: 860px) {
      .app {
        width: min(100vw - 22px, 680px);
        padding: 18px 0;
      }

      header {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
      }

      main {
        grid-template-columns: 1fr;
      }

      .preview-shell {
        min-height: 500px;
      }

      .stage {
        min-height: 360px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="headline">
        <h1 data-i18n="title">Lottie 动画格式转换</h1>
        <p class="subhead" data-i18n="subtitle">把 Lottie JSON 转成 PNG 动图、ProRes 4444 MOV、GIF 或 PNG 序列</p>
      </div>
      <div class="header-right">
        <div class="brand-name">饼饼SHOW</div>
      </div>
    </header>

    <main>
      <section class="panel" aria-label="转换设置">
        <label class="dropzone" id="dropzone">
          <input id="fileInput" type="file" accept=".json,application/json">
          <span>
            <span class="upload-icon" aria-hidden="true">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <path d="M12 16V4m0 0 5 5m-5-5L7 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 16.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="upload-title" data-i18n="upload">选择或拖入 JSON 文件</span>
            <span class="file-name" id="fileName"></span>
          </span>
        </label>

        <div class="controls">
          <div class="field">
            <label data-i18n="exportFormat">导出格式</label>
            <div class="format-options" role="radiogroup" aria-label="导出格式">
              <label class="format-option"><input type="radio" name="exportFormat" value="apng" checked><span data-i18n="pngAnimated">PNG 动图</span></label>
              <label class="format-option"><input type="radio" name="exportFormat" value="mov"><span>ProRes 4444 MOV</span></label>
              <label class="format-option"><input type="radio" name="exportFormat" value="gif"><span data-i18n="gifAnimated">GIF 动图</span></label>
              <label class="format-option"><input type="radio" name="exportFormat" value="sequence"><span data-i18n="pngSequence">PNG 序列 ZIP</span></label>
            </div>
          </div>

          <div class="field">
            <label for="sizeInput" data-i18n="exportSize">导出尺寸</label>
            <div class="quick-sizes">
              <button class="chip active" type="button" data-size="512">512</button>
              <button class="chip" type="button" data-size="1024">1024</button>
              <button class="chip" type="button" data-size="2048">2048</button>
              <button class="chip" type="button" data-size="4096">4096</button>
            </div>
            <div class="field-row">
              <input id="sizeRange" type="range" min="128" max="4096" step="64" value="512">
              <input id="sizeInput" type="number" min="128" max="4096" step="64" value="512">
            </div>
          </div>

          <div class="field fps-field">
            <label for="fpsInput" data-i18n="fps">帧率</label>
            <div class="field-row">
              <input id="fpsRange" type="range" min="1" max="120" step="0.01" value="30">
              <input id="fpsInput" type="number" min="1" max="120" step="0.01" value="30">
            </div>
          </div>

          <div class="field">
            <label for="modeSelect" data-i18n="exportRange">导出范围</label>
            <select id="modeSelect">
              <option value="full" data-i18n="full">完整动画</option>
              <option value="short" data-i18n="first3">前 3 秒</option>
              <option value="loop" selected data-i18n="loop">自动取一个循环段</option>
            </select>
          </div>

          <div class="actions">
            <button class="button secondary" id="playButton" type="button" disabled>
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8 5v14l11-7L8 5Z" fill="currentColor"/>
              </svg>
              <span data-i18n="preview">预览</span>
            </button>
            <button class="button primary" id="exportButton" type="button" disabled>
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3v12m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <span id="exportButtonText">导出 PNG 动图</span>
            </button>
          </div>
        </div>

        <div class="status" id="status"></div>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
        <div class="panel-footer">
          <div class="language-control">
            <div class="language-menu" id="languageMenu" hidden>
              <button type="button" data-lang="zh" aria-current="true">中文</button>
              <button type="button" data-lang="en">English</button>
              <button type="button" data-lang="fr">Français</button>
            </div>
            <div class="language-trigger">
              <button class="language-menu-button" id="languageMenuButton" type="button" aria-label="Language" aria-expanded="false"></button>
              <span>language</span>
            </div>
          </div>
          <nav class="social-links" aria-label="Social links">
            <a class="social-link" href="https://www.youtube.com/@wqsyyzx" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8Z"/><path fill="#ffffff" d="m9.6 15.6 6.3-3.6-6.3-3.6v7.2Z"/></svg>
            </a>
            <a class="social-link" href="https://xhslink.com/m/6haeQAMgARs" target="_blank" rel="noopener noreferrer" aria-label="小红书" title="小红书">
              <img src="/xiaohongshu.svg" alt="">
            </a>
            <a class="social-link" href="https://github.com/yuzhibowu/lottie2png" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.29-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18a10.94 10.94 0 0 1 5.76 0c2.19-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.71 5.39-5.29 5.68.42.36.79 1.07.79 2.16v3.21c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
            </a>
          </nav>
        </div>
      </section>

      <section class="preview-shell" aria-label="动画预览">
        <div class="preview-top">
          <div class="preview-title" id="previewTitle" data-i18n="previewArea">预览区</div>
          <div class="meta" id="meta" data-i18n="notLoaded">未载入</div>
        </div>
        <div class="stage">
          <div id="lottiePreview">
            <div class="empty" data-i18n="emptyPreview">动画载入后会在这里循环播放，透明区域用格子背景显示</div>
          </div>
        </div>
        <div class="preview-bottom">
          <span id="detailText" data-i18n="detailDefault">支持透明背景与循环动画导出</span>
          <span id="frameText" data-i18n="framesZero">0 帧</span>
        </div>
      </section>
    </main>
  </div>

  <div class="hidden-workbench" aria-hidden="true">
    <div id="renderHost"></div>
  </div>

  <script type="module">
    import lottie from "lottie-web";
    import UPNG from "upng-js";
    import { FFmpeg } from "@ffmpeg/ffmpeg";
    import { fetchFile, toBlobURL } from "@ffmpeg/util";
    import JSZip from "jszip";

    const ffmpegCoreBase = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm";
    let ffmpegCoreUrls = null;

    const translations = {
      zh: {
        title: "Lottie 动画格式转换", subtitle: "把 Lottie JSON 转成 PNG 动图、ProRes 4444 MOV、GIF 或 PNG 序列",
        upload: "选择或拖入 JSON 文件", exportFormat: "导出格式", pngAnimated: "PNG 动图", gifAnimated: "GIF 动图",
        pngSequence: "PNG 序列 ZIP", exportSize: "导出尺寸", fps: "帧率", exportRange: "导出范围",
        full: "完整动画", first3: "前 3 秒", loop: "自动取一个循环段", preview: "预览",

    };

    const fileInput = document.querySelector("#fileInput");
    const dropzone = document.querySelector("#dropzone");
    const fileName = document.querySelector("#fileName");
    const previewHost = document.querySelector("#lottiePreview");
    const previewStage = document.querySelector(".stage");
    const renderHost = document.querySelector("#renderHost");
    const playButton = document.querySelector("#playButton");
    const exportButton = document.querySelector("#exportButton");
    const exportButtonText = document.querySelector("#exportButtonText");
    const statusEl = document.querySelector("#status");
    const progressBar = document.querySelector("#progressBar");
    const previewTitle = document.querySelector("#previewTitle");
    const meta = document.querySelector("#meta");
    const detailText = document.querySelector("#detailText");
    const frameText = document.querySelector("#frameText");
    const sizeRange = document.querySelector("#sizeRange");
    const sizeInput = document.querySelector("#sizeInput");
    const fpsRange = document.querySelector("#fpsRange");
    const fpsInput = document.querySelector("#fpsInput");
    const modeSelect = document.querySelector("#modeSelect");
    const formatInputs = [...document.querySelectorAll('input[name="exportFormat"]')];
    const formatOptions = [...document.querySelectorAll(".format-option")];
    const sizeChips = [...document.querySelectorAll(".chip")];
    const languageMenu = document.querySelector("#languageMenu");
    const languageMenuButton = document.querySelector("#languageMenuButton");
    const languageButtons = [...languageMenu.querySelectorAll("[data-lang]")];

    let animationData = null;
    let previewAnim = null;
    let currentFileBase = "lottie";
    let isExporting = false;
    let previewScale = 1;
    let previewTargetScale = 1;
    let zoomAnimationFrame = null;
    let currentLanguage = "zh";
    let sourceMeta = null;
    let featureReport = null;
    let lastStatus = null;
    const SIZE_PRESETS = {
      default: { values: [512, 1024, 2048, 4096], min: 128, max: 4096, step: 64 },
      gif: { values: [135, 270, 512, 1024], min: 135, max: 1024, step: 1 }
    };
    const debugEnabled = new URLSearchParams(window.location.search).has("debug")
      || window.localStorage?.getItem("lottieDebug") === "1";
    const WAIT_TIMEOUTS = {
      dom: 5000,
      images: 8000,
      imagesOptional: 600,
      fonts: 5000,
      frame: 1200,
      svgImageDecode: 8000
    };

    function t(key, params = {}) {
      const template = translations[currentLanguage][key] || translations.zh[key] || key;
      return Object.entries(params).reduce(
        (text, [name, value]) => text.replaceAll(`{${name}}`, String(value)),
        template
      );
    }

    function setStatus(message, isError = false) {
      lastStatus = null;
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    function setStatusKey(key, params = {}, isError = false) {
      lastStatus = { key, params, isError };
      statusEl.textContent = t(key, params);
      statusEl.classList.toggle("error", isError);
    }

    function applyLanguage(language) {
      currentLanguage = translations[language] ? language : "zh";
      document.documentElement.lang = currentLanguage === "zh" ? "zh-CN" : currentLanguage;
      document.title = t("title");
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = t(element.dataset.i18n);
      });
      languageButtons.forEach((button) => {
        button.setAttribute("aria-current", String(button.dataset.lang === currentLanguage));
      });
      updateFormatUi();
      updateFrameEstimate();

      if (animationData && sourceMeta) {
        meta.textContent = `${sourceMeta.width} x ${sourceMeta.height} · ${sourceMeta.fps}fps`;
        detailText.textContent = t("detailLoaded", { seconds: sourceMeta.seconds });
      } else {
        previewTitle.textContent = t("previewArea");
        meta.textContent = t("notLoaded");
        detailText.textContent = t("detailDefault");
        const empty = previewHost.querySelector(".empty");
        if (empty) empty.textContent = t("emptyPreview");
      }

      if (lastStatus) {
        statusEl.textContent = t(lastStatus.key, lastStatus.params);
      }
    }

    function setProgress(value) {
      progressBar.style.width = `${Math.max(0, Math.min(100, value))}%`;
    }

    function applyPreviewScale() {
      previewHost.style.setProperty("--preview-scale", String(previewScale));
    }

    function animatePreviewZoom() {
      const difference = previewTargetScale - previewScale;
      previewScale += difference * 0.12;

      if (Math.abs(difference) < 0.0005) {
        previewScale = previewTargetScale;
        zoomAnimationFrame = null;
        applyPreviewScale();
        return;
      }

      applyPreviewScale();
      zoomAnimationFrame = requestAnimationFrame(animatePreviewZoom);
    }

    function startPreviewZoomAnimation() {
      if (zoomAnimationFrame === null) {
        zoomAnimationFrame = requestAnimationFrame(animatePreviewZoom);
      }
    }

    function debugLog(stage, details = {}) {
      if (!debugEnabled) return;
      let payload = details;
      try {
        payload = JSON.stringify(details);
      } catch {
        payload = String(details);
      }
      console.debug(`[lottie2png] ${stage}`, payload);
    }

    function cloneAnimationData(data) {
      if (typeof structuredClone === "function") {
        return structuredClone(data);
      }
      return JSON.parse(JSON.stringify(data));
    }

    function scanLottieFeatures(data) {
      const report = {
        imageAsset: false,
        textLayer: false,
        mask: false,
        matte: false,
        gradient: false,
        repeater: false,
        trimPath: false,
        expression: false,
        effect: false,
        timeRemapping: false,
        threeDLayer: false,
        camera: false
      };

      const visitShape = (shape) => {
        if (!shape || typeof shape !== "object") return;
        if (shape.ty === "gf" || shape.ty === "gs") report.gradient = true;
        if (shape.ty === "rp") report.repeater = true;
        if (shape.ty === "tm") report.trimPath = true;
        for (const value of Object.values(shape)) {
          if (Array.isArray(value)) {
            value.forEach(visitShape);
          } else if (value && typeof value === "object") {
            if (value.x) report.expression = true;
          }
        }
      };

      const visitLayer = (layer) => {
        if (!layer || typeof layer !== "object") return;
        if (layer.ty === 2) report.imageAsset = true;
        if (layer.ty === 5) report.textLayer = true;
        if (layer.ty === 13) report.camera = true;
        if (layer.hasMask || layer.masksProperties?.length) report.mask = true;
        if (Number.isFinite(layer.tt) || Number.isFinite(layer.td)) report.matte = true;
        if (layer.ef?.length) report.effect = true;
        if (layer.tm) report.timeRemapping = true;
        if (layer.ddd) report.threeDLayer = true;
        if (layer.ks && JSON.stringify(layer.ks).includes('"x"')) report.expression = true;
        layer.shapes?.forEach(visitShape);
        layer.layers?.forEach(visitLayer);
      };

      data.layers?.forEach(visitLayer);
      data.assets?.forEach((asset) => {
        if (asset.p && !asset.layers) report.imageAsset = true;
        asset.layers?.forEach(visitLayer);
      });

      return report;
    }

    function waitWithTimeout(promise, ms, label, { rejectOnTimeout = false } = {}) {
      let timeoutId;
      const timeout = new Promise((resolve, reject) => {
        timeoutId = window.setTimeout(() => {
          const error = new Error(`${label} timed out after ${ms}ms`);
          if (rejectOnTimeout) reject(error);
          else resolve({ timedOut: true, label });
        }, ms);
      });
      return Promise.race([
        promise.then((value) => ({ timedOut: false, label, value })),
        timeout
      ]).finally(() => window.clearTimeout(timeoutId));
    }

    function waitForAnimationEvent(anim, eventName, timeoutMs, options = {}) {
      const rejectOnTimeout = Boolean(options.rejectOnTimeout);
      return new Promise((resolve, reject) => {
        let timeoutId;
        const done = (event) => {
          cleanup();
          resolve({ timedOut: false, label: eventName, value: event });
        };
        const failed = (event) => {
          cleanup();
          reject(event?.nativeError || new Error(`${eventName} failed`));
        };
        const timedOut = () => {
          cleanup();
          const error = new Error(`${eventName} timed out after ${timeoutMs}ms`);
          if (rejectOnTimeout) reject(error);
          else resolve({ timedOut: true, label: eventName });
        };
        const cleanup = () => {
          window.clearTimeout(timeoutId);
          try {
            anim.removeEventListener(eventName, done);
            anim.removeEventListener("data_failed", failed);
            anim.removeEventListener("error", failed);
          } catch {
            // lottie-web clears its callback registry during destroy; stale timeout cleanup is safe to ignore.
          }
        };
        anim.addEventListener(eventName, done);
        anim.addEventListener("data_failed", failed);
        anim.addEventListener("error", failed);
        timeoutId = window.setTimeout(timedOut, timeoutMs);
      });
    }

    function waitForCondition(check, timeoutMs, label, intervalMs = 50) {
      return new Promise((resolve, reject) => {
        const startedAt = performance.now();
        let timeoutId;
        let intervalId;
        const cleanup = () => {
          window.clearTimeout(timeoutId);
          window.clearInterval(intervalId);
        };
        const tick = () => {
          let value = false;
          try {
            value = check();
          } catch {
            value = false;
          }
          if (value) {
            cleanup();
            resolve({ timedOut: false, label, value, elapsedMs: Math.round(performance.now() - startedAt) });
          }
        };
        intervalId = window.setInterval(tick, intervalMs);
        timeoutId = window.setTimeout(() => {
          cleanup();
          reject(new Error(`${label} timed out after ${timeoutMs}ms`));
        }, timeoutMs);
        tick();
      });
    }

    function cleanName(name) {
      return name.replace(/\.[^.]+$/, "").replace(/[^\w\u4e00-\u9fa5-]+/g, "-") || "lottie";
    }

    function clampNumber(value, min, max) {
      const number = Number(value);
      if (!Number.isFinite(number)) return min;
      return Math.max(min, Math.min(max, Math.round(number)));
    }

    function syncNumeric(range, input, min, max, value) {
      const next = clampNumber(value, min, max);
      range.value = next;
      input.value = next;
      if (range === sizeRange) updateSizeChips(next);
      updateFrameEstimate();
    }

    function syncFrameRate(value) {
      const number = Number(value);
      const next = Number.isFinite(number) ? Math.max(1, Math.min(120, number)) : 30;
      const displayValue = Number(next.toFixed(2));
      fpsRange.value = displayValue;
      fpsInput.value = displayValue;
      updateFrameEstimate();
    }

    function updateSizeChips(size) {
      sizeChips.forEach((chip) => chip.classList.toggle("active", Number(chip.dataset.size) === Number(size)));
    }

    function selectedFormat() {
      return formatInputs.find((input) => input.checked)?.value || "apng";
    }

    function currentSizePreset() {
      return selectedFormat() === "gif" ? SIZE_PRESETS.gif : SIZE_PRESETS.default;
    }

    function nearestSizePreset(value, sizes) {
      return sizes.reduce((nearest, size) => (
        Math.abs(size - value) < Math.abs(nearest - value) ? size : nearest
      ), sizes[0]);
    }

    function syncExportSize(value, { snapToPreset = false } = {}) {
      const preset = currentSizePreset();
      let next = clampNumber(value, preset.min, preset.max);
      if (snapToPreset) {
        next = nearestSizePreset(next, preset.values);
      }
      sizeRange.value = next;
      sizeInput.value = next;
      updateSizeChips(next);
      updateFrameEstimate();
    }

    function applySizePresetForFormat() {
      const preset = currentSizePreset();
      sizeRange.min = preset.min;
      sizeRange.max = preset.max;
      sizeRange.step = preset.step;
      sizeInput.min = preset.min;
      sizeInput.max = preset.max;
      sizeInput.step = preset.step;
      preset.values.forEach((size, index) => {
        const chip = sizeChips[index];
        chip.dataset.size = String(size);
        chip.textContent = String(size);
      });
      syncExportSize(sizeInput.value, { snapToPreset: selectedFormat() === "gif" });
    }

    function getSourceFrameRate() {
      return Number(animationData?.fr) || 30;
    }

    function getFrameBounds() {
      const ip = Math.floor(Number(animationData?.ip) || 0);
      const op = Math.ceil(Number(animationData?.op) || 0);
      const sourceFps = getSourceFrameRate();
      let start = ip;
      let end = Math.max(ip + 1, op);

      if (modeSelect.value === "short") {
        end = Math.min(end, start + Math.round(sourceFps * 3));
      }

      if (modeSelect.value === "loop") {
        end = Math.min(end, start + Math.round(sourceFps * 2));
      }

      return { start, end, sourceFps };
    }

    function getExportFrameCount() {
      if (!animationData) return 0;
      const { start, end, sourceFps } = getFrameBounds();
      const targetFps = Number(fpsInput.value) || 30;
      const durationSeconds = Math.max(1 / sourceFps, (end - start) / sourceFps);
      return Math.max(1, Math.ceil(durationSeconds * targetFps));
    }

    function updateFrameEstimate() {
      if (!animationData) {
        frameText.textContent = t("framesZero");
        return;
      }
      const frames = getExportFrameCount();
      const size = Number(sizeInput.value);
      const fps = Number(fpsInput.value) || 30;
      frameText.textContent = t("frameSummary", { fps, frames, size });
    }

    function destroyPreview() {
      if (previewAnim) {
        previewAnim.destroy();
        previewAnim = null;
      }
      previewHost.innerHTML = "";
    }

    function loadPreview() {
      destroyPreview();
      previewAnim = lottie.loadAnimation({
        container: previewHost,
        renderer: "svg",
        loop: true,
        autoplay: true,
        animationData: cloneAnimationData(animationData)
      });
    }

    async function loadFile(file) {
      try {
        setProgress(0);
        setStatusKey("reading");
        const text = await file.text();
        const data = JSON.parse(text);

        if (!data || typeof data !== "object" || !data.layers) {
          throw new Error(t("invalid"));
        }

        animationData = data;
        featureReport = scanLottieFeatures(data);
        previewScale = 1;
        previewTargetScale = 1;
        if (zoomAnimationFrame !== null) {
          cancelAnimationFrame(zoomAnimationFrame);
          zoomAnimationFrame = null;
        }
        applyPreviewScale();
        currentFileBase = cleanName(file.name);
        fileName.textContent = file.name;
        previewTitle.textContent = file.name;

        const width = Number(data.w) || 0;
        const height = Number(data.h) || 0;
        const fps = Number(data.fr) || 30;
        const totalFrames = Math.max(0, Math.ceil((Number(data.op) || 0) - (Number(data.ip) || 0)));
        const seconds = totalFrames ? (totalFrames / fps).toFixed(2) : "0";

        sourceMeta = { width, height, fps, seconds };
        debugLog("file-loaded", {
          fileName: file.name,
          lottieVersion: data.v || "unknown",
          width,
          height,
          fps,
          totalFrames,
          features: featureReport
        });

        meta.textContent = `${width} x ${height} · ${fps}fps`;
        detailText.textContent = t("detailLoaded", { seconds });
        syncFrameRate(fps);
        playButton.disabled = false;
        exportButton.disabled = false;
        setStatusKey("loaded");
        setProgress(0);
        loadPreview();
        updateFrameEstimate();
      } catch (error) {
        animationData = null;
        sourceMeta = null;
        featureReport = null;
        destroyPreview();
        previewHost.innerHTML = `<div class="empty">${t("noPreview")}</div>`;
        playButton.disabled = true;
        exportButton.disabled = true;
        meta.textContent = t("notLoaded");
        detailText.textContent = t("detailDefault");
        frameText.textContent = t("framesZero");
        setStatusKey(error.message === t("invalid") ? "invalid" : "readFailed", {}, true);
      }
    }

    function nextPaint() {
      return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    async function waitForFonts(features) {
      if (!features?.textLayer || !document.fonts?.ready) {
        return { timedOut: false, label: "fonts", skipped: true };
      }
      return waitWithTimeout(document.fonts.ready, WAIT_TIMEOUTS.fonts, "fonts");
    }

    async function waitForRenderReady(anim, features, renderer) {
      const startedAt = performance.now();
      const selector = renderer === "canvas" ? "canvas" : "svg";
      const domPromise = Promise.any([
        waitForAnimationEvent(anim, "DOMLoaded", WAIT_TIMEOUTS.dom, { rejectOnTimeout: true }),
        waitForCondition(() => renderHost.querySelector(selector), WAIT_TIMEOUTS.dom, `${renderer} DOM`)
      ]);
      const imagesPromise = features?.imageAsset
        ? waitForAnimationEvent(anim, "loaded_images", WAIT_TIMEOUTS.images, { rejectOnTimeout: true })
        : Promise.resolve({ timedOut: false, label: "loaded_images", skipped: true });
      const dom = await domPromise;
      const images = await imagesPromise;
      const fonts = await waitForFonts(features);
      await nextPaint();
      const elapsedMs = Math.round(performance.now() - startedAt);
      debugLog("renderer-ready", { renderer, elapsedMs, dom, images, fonts });
      return { elapsedMs, dom, images, fonts };
    }

    async function waitForFrameDraw(anim, frame, renderer) {
      const drawnFrame = waitForAnimationEvent(anim, "drawnFrame", WAIT_TIMEOUTS.frame);
      anim.goToAndStop(frame, true);
      const result = await drawnFrame;
      if (result.timedOut) {
        debugLog("frame-draw-timeout", { renderer, frame, timeoutMs: WAIT_TIMEOUTS.frame });
      } else {
        debugLog("frame-drawn", { renderer, frame });
      }
      await nextPaint();
      return result;
    }

    function isCanvasBlank(canvas) {
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      if (!canvas.width || !canvas.height) return true;
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const pixelCount = canvas.width * canvas.height;
      const stride = Math.max(1, Math.floor(pixelCount / 12000));
      for (let pixel = 0; pixel < pixelCount; pixel += stride) {
        if (data[pixel * 4 + 3] !== 0) return false;
      }
      if (data[(pixelCount - 1) * 4 + 3] !== 0) return false;
      return true;
    }

    function frameToOutput(targetCanvas, asPixels) {
      if (asPixels) {
        const ctx = targetCanvas.getContext("2d", { willReadFrequently: true });
        return ctx.getImageData(0, 0, targetCanvas.width, targetCanvas.height).data.buffer;
      }
      return new Promise((resolve, reject) => {
        targetCanvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error(t("pngFrameFailed")));
        }, "image/png");
      });
    }

    async function renderCanvasFrame(anim, targetCanvas, frame, asPixels) {
      await waitForFrameDraw(anim, frame, "canvas");
      const sourceCanvas = renderHost.querySelector("canvas");
      if (!sourceCanvas) {
        throw new Error(t("renderCanvasFailed"));
      }
      const ctx = targetCanvas.getContext("2d", { willReadFrequently: true });
      ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
      const scaledWidth = targetCanvas.width * previewScale;
      const scaledHeight = targetCanvas.height * previewScale;
      const offsetX = (targetCanvas.width - scaledWidth) / 2;
      const offsetY = (targetCanvas.height - scaledHeight) / 2;
      ctx.drawImage(sourceCanvas, offsetX, offsetY, scaledWidth, scaledHeight);
      return { output: await frameToOutput(targetCanvas, asPixels), blank: isCanvasBlank(targetCanvas) };
    }

    function hasUnsafeSvgReferences(svg) {
      return [...svg.querySelectorAll("image")].some((image) => {
        const href = image.getAttribute("href") || image.getAttribute("xlink:href") || "";
        if (!href || href.startsWith("data:") || href.startsWith("blob:") || href.startsWith("#")) return false;
        return true;
      });
    }

    async function decodeSvgToImage(svgText) {
      const blob = new Blob([svgText], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      try {
        const image = new Image();
        image.decoding = "async";
        image.src = url;
        await waitWithTimeout(
          image.decode ? image.decode() : new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = reject;
          }),
          WAIT_TIMEOUTS.svgImageDecode,
          "svg image decode",
          { rejectOnTimeout: true }
        );
        return image;
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function renderSvgFrame(anim, targetCanvas, frame, asPixels, size) {
      await waitForFrameDraw(anim, frame, "svg");
      const sourceSvg = renderHost.querySelector("svg");
      if (!sourceSvg) {
        throw new Error("SVG 回退失败：没有找到可序列化的 SVG 画面");
      }
      if (hasUnsafeSvgReferences(sourceSvg)) {
        throw new Error("SVG 回退失败：动画包含外链图片，无法安全绘制到透明 Canvas");
      }

      const svg = sourceSvg.cloneNode(true);
      svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      svg.setAttribute("width", String(size));
      svg.setAttribute("height", String(size));
      if (!svg.getAttribute("viewBox")) {
        svg.setAttribute("viewBox", `0 0 ${Number(animationData?.w) || size} ${Number(animationData?.h) || size}`);
      }

      const image = await decodeSvgToImage(new XMLSerializer().serializeToString(svg));
      const ctx = targetCanvas.getContext("2d", { willReadFrequently: true });
      ctx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
      const scaledWidth = targetCanvas.width * previewScale;
      const scaledHeight = targetCanvas.height * previewScale;
      const offsetX = (targetCanvas.width - scaledWidth) / 2;
      const offsetY = (targetCanvas.height - scaledHeight) / 2;
      ctx.drawImage(image, offsetX, offsetY, scaledWidth, scaledHeight);
      return { output: await frameToOutput(targetCanvas, asPixels), blank: isCanvasBlank(targetCanvas) };
    }

    async function renderFramesWithRenderer(renderer, targetCanvas, frameCount, start, end, asPixels, size) {
      renderHost.innerHTML = "";
      renderHost.style.width = `${size}px`;
      renderHost.style.height = `${size}px`;
      debugLog("renderer-start", { renderer, frameCount, start, end, features: featureReport });

      const renderAnim = lottie.loadAnimation({
        container: renderHost,
        renderer,
        loop: false,
        autoplay: false,
        animationData: cloneAnimationData(animationData),
        rendererSettings: {
          clearCanvas: true,
          preserveAspectRatio: "xMidYMid meet"
        }
      });

      try {
        await waitForRenderReady(renderAnim, featureReport, renderer);

        const frames = [];
        let blankCount = 0;
        for (let index = 0; index < frameCount; index += 1) {
          const progress = index / frameCount;
          const frame = start + progress * (end - start);
          const rendered = renderer === "canvas"
            ? await renderCanvasFrame(renderAnim, targetCanvas, frame, asPixels)
            : await renderSvgFrame(renderAnim, targetCanvas, frame, asPixels, size);
          frames.push(rendered.output);
          if (rendered.blank) blankCount += 1;
          if (index % 2 === 0 || index === frameCount - 1) {
            setProgress(((index + 1) / frameCount) * 70);
            setStatusKey("rendering", { current: index + 1, total: frameCount });
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
        }

        if (blankCount === frameCount) {
          throw new Error(`${renderer} renderer produced only blank frames`);
        }

        debugLog("renderer-finished", { renderer, frameCount, blankCount });
        return frames;
      } finally {
        renderAnim.destroy();
        renderHost.innerHTML = "";
      }
    }

    function updateFormatUi() {
      const labels = {
        apng: t("exportApng"),
        mov: t("exportMov"),
        gif: t("exportGif"),
        sequence: t("exportSequence")
      };
      exportButtonText.textContent = labels[selectedFormat()];
      applySizePresetForFormat();
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    async function exportPngSequence(frames) {
      const zip = new JSZip();
      frames.forEach((frame, index) => {
        zip.file(`${currentFileBase}_${String(index + 1).padStart(5, "0")}.png`, frame);
      });
      return zip.generateAsync(
        { type: "blob", compression: "DEFLATE" },
        ({ percent }) => {
          setProgress(72 + (percent / 100) * 27);
          setStatusKey("zipProgress", { percent: Math.round(percent) });
        }
      );
    }

    async function loadBrowserFfmpeg() {
      setStatusKey("loadingEncoder");
      if (!ffmpegCoreUrls) {
        ffmpegCoreUrls = Promise.all([
          toBlobURL(`${ffmpegCoreBase}/ffmpeg-core.js`, "text/javascript"),
          toBlobURL(`${ffmpegCoreBase}/ffmpeg-core.wasm`, "application/wasm")
        ]);
      }

      const [coreURL, wasmURL] = await ffmpegCoreUrls;
      const ffmpeg = new FFmpeg();
      let latestLog = "";
      ffmpeg.on("log", ({ message }) => {
        latestLog = message;
      });
      ffmpeg.on("progress", ({ progress }) => {
        if (Number.isFinite(progress)) {
          setProgress(84 + Math.min(1, Math.max(0, progress)) * 15);
        }
      });
      await ffmpeg.load({ coreURL, wasmURL });
      return { ffmpeg, getLatestLog: () => latestLog };
    }

    async function exportEncodedFile(format, frames, fps) {
      const { ffmpeg, getLatestLog } = await loadBrowserFfmpeg();
      const frameNames = frames.map((_, index) => `frame_${String(index).padStart(5, "0")}.png`);
      const outputName = format === "mov" ? "output.mov" : "output.gif";
      const args = format === "mov"
        ? [
            "-framerate", String(fps), "-i", "frame_%05d.png",
            "-c:v", "prores_ks", "-profile:v", "4", "-pix_fmt", "yuva444p10le", "-vendor", "apl0",
            outputName
          ]
        : [
            "-framerate", String(fps), "-i", "frame_%05d.png",
            "-filter_complex",
            "[0:v]split[s0][s1];[s0]palettegen=reserve_transparent=on:stats_mode=single[p];[s1][p]paletteuse=alpha_threshold=128",
            "-loop", "0", outputName
          ];

      try {
        for (let index = 0; index < frames.length; index += 1) {
          await ffmpeg.writeFile(frameNames[index], await fetchFile(frames[index]));
          setProgress(72 + ((index + 1) / frames.length) * 10);
          setStatusKey("preparingEncode", { current: index + 1, total: frames.length });
        }

        setStatusKey(format === "mov" ? "encodingMov" : "encodingGif");
        const exitCode = await ffmpeg.exec(args);
        if (exitCode !== 0) {
          throw new Error(getLatestLog() || t("encoderExit", { code: exitCode }));
        }
        const output = await ffmpeg.readFile(outputName);
        return new Blob([output.buffer], {
          type: format === "mov" ? "video/quicktime" : "image/gif"
        });
      } finally {
        await Promise.allSettled([...frameNames, outputName].map((name) => ffmpeg.deleteFile(name)));
        ffmpeg.terminate();
      }
    }

    async function exportAnimation() {
      if (!animationData || isExporting) return;

      isExporting = true;
      exportButton.disabled = true;
      playButton.disabled = true;
      setProgress(0);

      const preset = currentSizePreset();
      const size = selectedFormat() === "gif"
        ? nearestSizePreset(clampNumber(sizeInput.value, preset.min, preset.max), preset.values)
        : clampNumber(sizeInput.value, preset.min, preset.max);
      syncExportSize(size);
      const fps = Math.max(1, Math.min(120, Number(fpsInput.value) || 30));
      const format = selectedFormat();
      const { start, end } = getFrameBounds();
      const frameCount = getExportFrameCount();
      const frameDurationMs = Math.round(1000 / fps);
      const targetCanvas = document.createElement("canvas");
      targetCanvas.width = size;
      targetCanvas.height = size;

      try {
        setStatusKey("preparingRender");
        const asPixels = format === "apng";
        let frames;
        let exportRenderer = "canvas";

        try {
          frames = await renderFramesWithRenderer("canvas", targetCanvas, frameCount, start, end, asPixels, size);
        } catch (canvasError) {
          debugLog("canvas-renderer-failed", {
            stage: "render",
            message: canvasError?.message || String(canvasError),
            features: featureReport
          });
          exportRenderer = "svg";
          debugLog("svg-fallback-triggered", { reason: canvasError?.message || String(canvasError) });
          frames = await renderFramesWithRenderer("svg", targetCanvas, frameCount, start, end, asPixels, size);
        }
        debugLog("export-renderer-selected", { renderer: exportRenderer });

        let blob;
        let filename;
        if (format === "apng") {
          setStatusKey("packingApng");
          setProgress(88);
          const delays = Array(frameCount).fill(frameDurationMs);
          const arrayBuffer = UPNG.encode(frames, size, size, 0, delays);
          blob = new Blob([arrayBuffer], { type: "image/png" });
          filename = `${currentFileBase}-${size}px-${fps}fps.png`;
        } else if (format === "sequence") {
          blob = await exportPngSequence(frames);
          filename = `${currentFileBase}-png-sequence.zip`;
        } else {
          blob = await exportEncodedFile(format, frames, fps);
          filename = format === "mov"
            ? `${currentFileBase}-${size}px-${fps}fps-prores4444.mov`
            : `${currentFileBase}-${size}px-${fps}fps.gif`;
        }

        downloadBlob(blob, filename);
        setProgress(100);
        setStatusKey("complete", { filename });
      } catch (error) {
        const message = error?.message || t("exportFailed");
        debugLog("export-failed", {
          stage: "export",
          message,
          features: featureReport
        });
        const hint = message.includes("tainted")
          ? t("tainted")
          : message;
        setStatus(hint, true);
      } finally {
        renderHost.innerHTML = "";
        isExporting = false;
        exportButton.disabled = !animationData;
        playButton.disabled = !animationData;
      }
    }

    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      if (file) loadFile(file);
    });

    dropzone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("dragover");
    });

    dropzone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropzone.classList.remove("dragover");
      const file = [...event.dataTransfer.files].find((item) => item.name.toLowerCase().endsWith(".json"));
      if (file) loadFile(file);
    });

    sizeRange.addEventListener("input", () => syncExportSize(sizeRange.value, { snapToPreset: selectedFormat() === "gif" }));
    sizeInput.addEventListener("change", () => syncExportSize(sizeInput.value, { snapToPreset: selectedFormat() === "gif" }));
    fpsRange.addEventListener("input", () => syncFrameRate(fpsRange.value));
    fpsInput.addEventListener("change", () => syncFrameRate(fpsInput.value));
    modeSelect.addEventListener("change", updateFrameEstimate);

    previewStage.addEventListener("wheel", (event) => {
      if (!animationData || isExporting) return;
      event.preventDefault();
      if (event.deltaY === 0) return;
      const normalizedDelta = Math.max(-120, Math.min(120, event.deltaY));
      const scaleFactor = Math.exp(-normalizedDelta * 0.00035);
      previewTargetScale = Math.max(0.1, Math.min(4, previewTargetScale * scaleFactor));
      startPreviewZoomAnimation();
    }, { passive: false });

    sizeChips.forEach((chip) => {
      chip.addEventListener("click", () => syncExportSize(chip.dataset.size));
    });

    playButton.addEventListener("click", () => {
      if (!previewAnim) return;
      if (previewAnim.isPaused) {
        previewAnim.play();
      } else {
        previewAnim.pause();
      }
    });

    formatInputs.forEach((input) => input.addEventListener("change", updateFormatUi));
    formatOptions.forEach((option) => {
      option.addEventListener("click", () => requestAnimationFrame(updateFormatUi));
    });
    languageMenuButton.addEventListener("click", () => {
      const willOpen = languageMenu.hidden;
      languageMenu.hidden = !willOpen;
      languageMenuButton.setAttribute("aria-expanded", String(willOpen));
    });

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => {
        applyLanguage(button.dataset.lang);
        languageMenu.hidden = true;
        languageMenuButton.setAttribute("aria-expanded", "false");
      });
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".language-control")) {
        languageMenu.hidden = true;
        languageMenuButton.setAttribute("aria-expanded", "false");
      }
    });

    applyLanguage("zh");
    exportButton.addEventListener("click", exportAnimation);
  </script>
</body>
</html>
